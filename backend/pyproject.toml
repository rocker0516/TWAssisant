[project]
name = "twassistant-backend"
version = "0.1.0"
description = "台股操作助手 — 進場推薦 + 出場提醒（本機單人跑）"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
