# TWAssistant 資料來源憑證範例
#
# 用法（擇一）：
#   1) 複製本檔為 credentials.toml 並填入 token（已被 .gitignore 排除，不會入庫）
#   2) 或存進 macOS Keychain：
#        security add-generic-password -a twassistant -s fugle_token   -w "你的token"
#        security add-generic-password -a twassistant -s finmind_token -w "你的token"
#      Keychain 優先於本檔。
#
# 兩個來源都「全免費」，去官網申請即可：
#   Fugle 富果行情 API:  https://developer.fugle.tw/  （行情/K線）
#   FinMind:            https://finmindtrade.com/      （籌碼/基本面）
# 重訊來源（公開資訊觀測站）為公開頁，免 token。

[sources]
fugle_token = ""
finmind_token = ""
# Claude API（LLM 解讀/助手，P5）。申請：https://console.anthropic.com
# 建議改存 Keychain：security add-generic-password -a twassistant -s anthropic_token -w "sk-ant-..."
anthropic_token = ""

[notify]
# Discord webhook（盤後持股提醒推播，P2）。空白則略過通知。
webhook = ""
