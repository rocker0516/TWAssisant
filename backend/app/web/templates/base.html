<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TWAssistant 台股盤後{% endblock %}</title>
  <meta name="description" content="{% block description %}台股每日盤後資料：排行、類股、個股。全部取自證交所／櫃買中心官方開放資料。{% endblock %}">
  {% if noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* 與登入後 SPA 同一套視覺 token（frontend/src/index.css＋tailwind.config）：
       panel 色系、sky 藍 accent、紅漲綠跌、rounded-xl 卡片、無光暈。
       結構仍是 top-nav（內容頁的正確形狀），但看起來要像同一個產品。 */
    :root {
      --bg:      #0F1115;   /* = SPA --c-bg */
      --card:    #181B22;   /* = --c-panel */
      --card-2:  #1F232C;   /* = --c-panel2（hover/表頭） */
      --ink:     #E6E8EE;   /* = --c-text */
      --ink-2:   #8B93A7;   /* = --c-muted */
      --ink-3:   #646E7D;
      --line:    #2A2F3A;   /* = --c-edge */
      --line-2:  #3B4250;   /* hover 卡框 */
      --brand:   #38BDF8;   /* sky-400＝SPA accent */
      --brand-2: #7DD3FC;   /* sky-300＝連結/文字 accent */
      --up:      #F87171;   /* red-400（台股紅漲） */
      --down:    #34D399;   /* emerald-400（綠跌） */
      --sans: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      --mono: "Cascadia Mono", ui-monospace, "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background: var(--bg);
      font-family: var(--sans); font-size: 15px; line-height: 1.75;
    }

    /* 頂欄：同 SPA sidebar 的 panel 材質（panel 底＋edge 邊線） */
    header.site { background: var(--card); border-bottom: 1px solid var(--line); }
    .shell { max-width: 1060px; margin: 0 auto; padding: 0 22px; }
    .masthead { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 13px 0; }
    .masthead .brand {
      color: var(--ink); text-decoration: none; line-height: 1.25;
    }
    .masthead .brand .t { font-size: 17px; font-weight: 700; display: block; }
    .masthead .brand .s { font-size: 11px; color: var(--ink-2); display: block; }
    .masthead nav { display: flex; gap: 2px; font-size: 13.5px; flex-wrap: wrap; }
    .masthead nav a {
      color: var(--ink-2); text-decoration: none; padding: 6px 12px; border-radius: 8px;
      transition: color .15s, background .15s;
    }
    .masthead nav a:hover { color: var(--ink); background: var(--card-2); }
    .masthead nav a.active { color: var(--brand-2); background: rgba(12, 74, 110, .5); } /* = SPA bg-sky-900/50 text-sky-200 */
    .masthead .login { margin-left: auto; }
    .masthead .login a {
      color: #fff; background: #0284C7; text-decoration: none; font-size: 13px;
      font-weight: 700; padding: 7px 18px; border-radius: 8px; transition: background .15s;
    }
    .masthead .login a:hover { background: #0EA5E9; }
    .dateline { display: flex; align-items: center; gap: 12px; padding: 8px 0 10px; font-size: 12.5px; color: var(--ink-3); }
    .stamp {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--ink-2); border: 1px solid var(--line); background: var(--card-2);
      border-radius: 999px; font-size: 12px; letter-spacing: .05em; padding: 2px 13px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .stamp::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand);
    }

    main { max-width: 1060px; margin: 0 auto; padding: 12px 22px 72px; }
    h1 { font-size: 27px; font-weight: 900; letter-spacing: .01em; margin: 28px 0 6px; }
    h2 { font-size: 15px; font-weight: 700; letter-spacing: .05em; margin: 30px 0 10px; color: var(--ink-2); }

    /* ── 卡片：同 SPA 的 rounded-xl＋edge 邊框，hover 只變邊色（不浮起） ── */
    .tbl, .boards > section, .stats {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      transition: border-color .15s;
    }
    .tbl:hover, .boards > section:hover { border-color: var(--line-2); }
    .tbl { overflow-x: auto; }
    .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
    .boards > section { padding: 16px 6px 6px; }
    .boards > section > h2 { margin: 0 0 8px 16px; }
    .boards .tbl { border: 0; border-radius: 0; background: none; }
    .boards .tbl:hover { transform: none; box-shadow: none; }

    /* 統計磚（個股頁行情） */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      padding: 4px; gap: 4px; background: none; border: 0;
    }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 16px 10px; transition: border-color .15s;
    }
    .stat:hover { border-color: var(--line-2); }
    .stat .k { font-size: 11.5px; color: var(--ink-3); letter-spacing: .1em; }
    .stat .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.35; }

    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: right; padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    th:first-child, td:first-child, th.l, td.l { text-align: left; }
    thead th { font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: .12em; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: var(--card-2); }
    td { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    a.code { color: var(--ink); text-decoration: none; }
    a.code:hover { color: var(--brand-2); }
    td:first-child, .mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
    td:first-child a.code { color: var(--ink-3); }
    td:first-child a.code:hover { color: var(--brand-2); }

    /* 進頁動效：主欄直屬子元素逐個淡入上浮 */
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise .45s cubic-bezier(.2, .7, .3, 1) backwards; }
      main > *:nth-child(1) { animation-delay: .02s; }
      main > *:nth-child(2) { animation-delay: .06s; }
      main > *:nth-child(3) { animation-delay: .10s; }
      main > *:nth-child(4) { animation-delay: .14s; }
      main > *:nth-child(5) { animation-delay: .18s; }
      main > *:nth-child(6) { animation-delay: .22s; }
      main > *:nth-child(7) { animation-delay: .26s; }
      main > *:nth-child(8) { animation-delay: .30s; }
      main > *:nth-child(n+9) { animation-delay: .34s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    }

    footer.site {
      max-width: 1060px; margin: 0 auto; padding: 18px 22px 40px;
      border-top: 1px solid var(--line);
      font-size: 12px; color: var(--ink-3);
    }
  </style>
</head>
<body>
  {% set path = request.url.path %}
  <header class="site">
    <div class="shell">
      <div class="masthead">
        <a class="brand" href="/"><span class="t">TWAssistant</span><span class="s">台股操作助手</span></a>
        <nav>
          <a href="/daily" class="{{ 'active' if path.startswith('/daily') }}">每日盤後</a>
          <a href="/rankings" class="{{ 'active' if path.startswith('/rankings') }}">排行榜</a>
          <a href="/sectors" class="{{ 'active' if path.startswith('/sectors') }}">類股</a>
          <a href="/revenue" class="{{ 'active' if path.startswith('/revenue') }}">月營收</a>
          <a href="/dividends" class="{{ 'active' if path.startswith('/dividends') }}">除權息</a>
          <a href="/track-record" class="{{ 'active' if path.startswith('/track-record') }}">戰績</a>
          <a href="/stocks" class="{{ 'active' if path.startswith('/stock') }}">個股索引</a>
        </nav>
        <span class="login"><a href="/login">登入</a></span>
      </div>
      {% if cutoff %}
      <div class="dateline">
        <span class="stamp">{{ cutoff }} 收盤資料</span>
        <span>每日盤後更新．非即時報價</span>
      </div>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    資料來源：臺灣證券交易所／櫃買中心公開資料。本站所有內容為歷史資料整理與趨勢判讀，
    非投資建議；投資決策與風險請自行承擔。
  </footer>
</body>
</html>
