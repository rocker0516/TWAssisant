<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TWAssistant 台股盤後{% endblock %}</title>
  <meta name="description" content="{% block description %}台股每日盤後資料：排行、類股、個股。全部取自證交所／櫃買中心官方開放資料。{% endblock %}">
  {% if noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* 夜航儀表：近黑底＋電光青品牌色，紅綠只留給漲跌（品牌與語意分離）。
       一切內容都是卡片：hover 浮起、進頁逐張淡入。單一主題（深色）。 */
    :root {
      --bg:      #0A0E14;
      --card:    #10161F;
      --card-2:  #151D28;   /* hover/表頭 */
      --ink:     #E9EEF3;
      --ink-2:   #93A3B1;
      --ink-3:   #5B6B79;
      --line:    #1D2835;   /* 卡框/髮絲線 */
      --line-2:  #2C3E52;   /* hover 卡框 */
      --brand:   #3ECBFF;   /* 電光青＝品牌 */
      --up:      #FF5D5D;   /* 漲 */
      --down:    #35D6A0;   /* 跌 */
      --sans: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      --mono: "Cascadia Mono", ui-monospace, "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      background: var(--bg);
      background-image: radial-gradient(60% 42% at 50% -12%, rgba(62, 203, 255, .075), transparent 70%);
      background-repeat: no-repeat;
      font-family: var(--sans); font-size: 15px; line-height: 1.75;
    }

    header.site { max-width: 1060px; margin: 0 auto; padding: 22px 22px 0; }
    .masthead { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .masthead .brand {
      font-size: 19px; font-weight: 900; letter-spacing: .02em;
      color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 9px;
    }
    .masthead .brand::before {
      content: ""; width: 9px; height: 9px; border-radius: 3px;
      background: var(--brand); box-shadow: 0 0 12px rgba(62, 203, 255, .8);
    }
    .masthead nav { display: flex; gap: 4px; font-size: 13.5px; }
    .masthead nav a {
      color: var(--ink-2); text-decoration: none; padding: 5px 12px; border-radius: 7px;
      transition: color .15s, background .15s;
    }
    .masthead nav a:hover { color: var(--ink); background: var(--card-2); }
    .masthead .login { margin-left: auto; }
    .masthead .login a {
      color: var(--bg); background: var(--brand); text-decoration: none; font-size: 13px;
      font-weight: 700; padding: 6px 18px; border-radius: 8px;
      transition: transform .15s, box-shadow .15s;
    }
    .masthead .login a:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(62, 203, 255, .35); }
    .dateline { display: flex; align-items: center; gap: 12px; padding: 14px 0 0; font-size: 12.5px; color: var(--ink-3); }
    .stamp {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--ink-2); border: 1px solid var(--line); background: var(--card);
      border-radius: 999px; font-size: 12px; letter-spacing: .05em; padding: 2px 13px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .stamp::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--brand); box-shadow: 0 0 8px rgba(62, 203, 255, .9);
    }

    main { max-width: 1060px; margin: 0 auto; padding: 4px 22px 72px; }
    h1 { font-size: 27px; font-weight: 900; letter-spacing: .01em; margin: 28px 0 6px; }
    h2 { font-size: 15px; font-weight: 700; letter-spacing: .05em; margin: 30px 0 10px; color: var(--ink-2); }

    /* ── 卡片 ── */
    .tbl, .boards > section, .stats {
      background: var(--card); border: 1px solid var(--line); border-radius: 13px;
      transition: border-color .18s, transform .18s, box-shadow .18s;
    }
    .tbl:hover, .boards > section:hover {
      border-color: var(--line-2); transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
    }
    .tbl { overflow-x: auto; }
    .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
    .boards > section { padding: 16px 6px 6px; }
    .boards > section > h2 { margin: 0 0 8px 16px; }
    .boards .tbl { border: 0; border-radius: 0; background: none; }
    .boards .tbl:hover { transform: none; box-shadow: none; }

    /* 統計磚（個股頁行情） */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      padding: 4px; gap: 4px; background: none; border: 0;
    }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 11px;
      padding: 12px 16px 10px; transition: border-color .18s, transform .18s;
    }
    .stat:hover { border-color: var(--line-2); transform: translateY(-2px); }
    .stat .k { font-size: 11.5px; color: var(--ink-3); letter-spacing: .1em; }
    .stat .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.35; }

    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: right; padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    th:first-child, td:first-child, th.l, td.l { text-align: left; }
    thead th { font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: .12em; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: var(--card-2); }
    td { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    a.code { color: var(--ink); text-decoration: none; }
    a.code:hover { color: var(--brand); }
    td:first-child, .mono { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
    td:first-child a.code { color: var(--ink-3); }
    td:first-child a.code:hover { color: var(--brand); }

    /* 進頁動效：主欄直屬子元素逐個淡入上浮 */
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise .45s cubic-bezier(.2, .7, .3, 1) backwards; }
      main > *:nth-child(1) { animation-delay: .02s; }
      main > *:nth-child(2) { animation-delay: .06s; }
      main > *:nth-child(3) { animation-delay: .10s; }
      main > *:nth-child(4) { animation-delay: .14s; }
      main > *:nth-child(5) { animation-delay: .18s; }
      main > *:nth-child(6) { animation-delay: .22s; }
      main > *:nth-child(7) { animation-delay: .26s; }
      main > *:nth-child(8) { animation-delay: .30s; }
      main > *:nth-child(n+9) { animation-delay: .34s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    }

    footer.site {
      max-width: 1060px; margin: 0 auto; padding: 18px 22px 40px;
      border-top: 1px solid var(--line);
      font-size: 12px; color: var(--ink-3);
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="masthead">
      <a class="brand" href="/">TWAssistant</a>
      <nav>
        <a href="/daily">每日盤後</a>
        <a href="/rankings">排行榜</a>
        <a href="/sectors">類股</a>
        <a href="/revenue">月營收</a>
        <a href="/dividends">除權息</a>
        <a href="/track-record">戰績</a>
        <a href="/stocks">個股索引</a>
      </nav>
      <span class="login"><a href="/login">登入</a></span>
    </div>
    {% if cutoff %}
    <div class="dateline">
      <span class="stamp">{{ cutoff }} 收盤資料</span>
      <span>每日盤後更新．非即時報價</span>
    </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    資料來源：臺灣證券交易所／櫃買中心公開資料。本站所有內容為歷史資料整理與趨勢判讀，
    非投資建議；投資決策與風險請自行承擔。
  </footer>
</body>
</html>
